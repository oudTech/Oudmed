# Render Blueprint for OudHealth's API (oudmed.com). The web app is on Fly.io
# (see fly.toml) - this file declares the API service only.
#
# This does NOT create the database or object storage (Neon and Cloudflare R2
# are external - see docs/DEPLOYMENT.md) and it does NOT run the one-time
# database bootstrap (migrate + RLS + first platform user - also in
# docs/DEPLOYMENT.md). Read that file before applying this blueprint.
#
# Apply: Render dashboard -> New -> Blueprint -> point at this repo/branch.
# Every `sync: false` var is a secret you paste into the Render dashboard after
# the blueprint creates the service (never commit real secrets here).
#
# Plan: NOT `free`. The nightly bed-charge job and the three subscription-
# renewal crons (@Cron in bed-charges.service.ts / renewal.service.ts) only
# fire while the process is alive - a free instance that has spun down from
# 15 minutes of idle simply skips that day's run. Use at least the `starter`
# plan (always-on, no sleep) for production.
#
# autoDeploy is deliberately false (2026-10-12): real hospitals are already
# registered on this service. Every container boot runs `prisma migrate
# deploy` + re-applies rls.sql against the live production database
# (docker-entrypoint.sh) - safe/idempotent when nothing changed, but a push-
# triggered deploy on every commit to main (including routine docs/test/CI
# commits that never touch apps/api at all) is not a risk worth taking on a
# system with real patient data, when a deliberate one-click "Manual Deploy"
# in the Render dashboard costs nothing. If you change this back to true,
# say so here and in docs/DEPLOYMENT.md explicitly - don't let it drift
# silently on a future Blueprint re-sync.

services:
  - type: web
    name: oudhealth-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt # closest Render region to the initial market; change freely
    branch: main
    autoDeploy: false
    healthCheckPath: /api/health
    domains:
      - api.oudmed.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: ENABLE_SWAGGER
        value: "false"

      # Error tracking (Sentry). Optional - leave blank in the dashboard to
      # keep it disabled (errors still go to Render's own logs either way).
      - key: SENTRY_DSN
        sync: false

      # Domain layout (see docs/DEPLOY.md for the DNS records this needs)
      - key: APP_ROOT_DOMAIN
        value: oudmed.com
      - key: APP_PROTOCOL
        value: https
      - key: FRONTEND_URL
        value: https://oudmed.com

      # Auth
      - key: JWT_SECRET
        generateValue: true

      # Database - Neon (owner connection runs migrate/rls on every boot; the app
      # itself connects through APP_DATABASE_URL, the non-superuser role). Both
      # are produced by the one-time bootstrap in docs/DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: APP_DB_PASSWORD
        sync: false

      # Object storage - Cloudflare R2 (S3-compatible)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # R2's public pub-xxx.r2.dev host already points directly at one bucket -
      # forcing regular path-style there puts the bucket name in the URL a
      # second time (404); this tells the SDK to leave the endpoint untouched
      # instead. See storage.service.ts.
      - key: S3_PUBLIC_BUCKET_ENDPOINT
        value: "true"
      - key: FILE_MAX_MB
        value: "20"

      # Transactional email (Resend). Leave RESEND_API_KEY unset in the dashboard
      # to print verification / reset links to the service logs instead.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Oudmed <noreply@oudmed.com>"

      # Malware scanning is opt-in and needs a clamd host reachable from Render -
      # skip it for the pilot (uploads are recorded scanStatus=SKIPPED).
      - key: CLAMAV_HOST
        value: ""

      # Marketing site "Contact Us" form (POST /contact). Required in production -
      # env.validation.ts fails the API's boot without it. Get the secret key from
      # the Cloudflare Turnstile dashboard; the matching site key is a Fly secret
      # on the web app, not here. CONTACT_INQUIRY_TO defaults to
      # info@Oudtechnologies.com in code if left unset in the dashboard.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CONTACT_INQUIRY_TO
        sync: false
