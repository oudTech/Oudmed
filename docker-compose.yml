# Local development infrastructure.
#
# This file provides ONLY the backing services the app needs. The API and web
# apps themselves run from source with pnpm during development:
#
#   docker compose up -d                 # start db + minio
#   pnpm --filter @oudhealth/api start:dev
#   pnpm --filter @oudhealth/web dev
#
# For a fully containerised stack (built images, prod-style), see docs/DEPLOY.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: oudhealth
      POSTGRES_PASSWORD: oudhealth
      POSTGRES_DB: oudhealth
    ports:
      - "5432:5432"
    volumes:
      - oud_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oudhealth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # minio/minio and minio/mc were pulled from Docker Hub entirely (and from
  # every other free registry/binary channel checked - confirmed 2026-10-12)
  # as part of MinIO's 2025 licensing changes - there is no free way to run
  # the real community MinIO server anymore. adobe/s3mock is a drop-in
  # replacement for local dev/CI: same S3 REST API, same AWS-SDK presigned-
  # URL flow apps/api's StorageService actually uses, confirmed by hand
  # against this exact service. It has no auth model at all (any
  # S3_ACCESS_KEY/S3_SECRET_KEY value works) and does not persist across
  # restarts - both fine for a local/CI test double, never for production
  # (production targets a real managed S3-compatible provider - AWS S3,
  # Cloudflare R2, Backblaze B2, DigitalOcean Spaces - not anything in this
  # file; see docs/DEPLOYMENT.md).
  minio:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      initialBuckets: oudhealth-dev
    ports:
      - "9000:9090"
    healthcheck:
      # No curl in this image (a minimal buildpacks-based Java image) - wget
      # is present and does the same job.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # initialBuckets alone was not reliable in testing - this explicitly
  # creates the bucket the same way the old mc-based setup service did.
  # Bucket creation on S3 is just an empty PUT to /{bucket}; s3mock accepts
  # it unsigned, so no S3 client/SDK image is needed here at all.
  minio-setup:
    image: curlimages/curl:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      curl -sf -X PUT http://minio:9090/oudhealth-dev &&
      echo 'bucket ready';
      "

volumes:
  oud_pgdata:
