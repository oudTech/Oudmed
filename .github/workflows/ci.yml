name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oudhealth
          POSTGRES_PASSWORD: oudhealth
          POSTGRES_DB: oudhealth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oudhealth"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      # Owner connection: migrations, seed, prisma:rls, db:setup-role.
      DATABASE_URL: postgresql://oudhealth:oudhealth@localhost:5432/oudhealth?schema=public
      # App role: the API process connects here so RLS is exercised by the tests.
      APP_DATABASE_URL: postgresql://oudhealth_app:oudhealth-app-ci@localhost:5432/oudhealth?schema=public
      APP_DB_PASSWORD: oudhealth-app-ci
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: oudhealth-dev
      S3_ACCESS_KEY: oudhealth
      S3_SECRET_KEY: oudhealth-dev-secret
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      # Anonymous Docker Hub pulls from GitHub's shared runner IPs get rate-
      # limited/denied - postgres:16 above (a "services:" container, pulled by
      # GitHub before any step runs) tends to survive because it's one of the
      # handful of images GitHub pre-caches; minio/minio below is not, and a
      # bare `docker run` has hit "pull access denied" for it. Authenticating
      # raises the pull quota well past what one CI run needs. No-ops (does
      # nothing, does not fail the job) if the secrets are not set, so this is
      # safe to merge before they exist - just re-run the job once they're added.
      # continue-on-error: this step is a rate-limit mitigation, never a hard
      # requirement - DOCKERHUB_USERNAME set without a valid DOCKERHUB_TOKEN
      # (expired/missing secret) must not abort the whole job either, the same
      # safety the "if:" guard already gives the fully-unset case.
      - name: Log in to Docker Hub (raises the anonymous-pull rate limit)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Forbidden-dash scan
        run: node scripts/check-dashes.mjs

      - name: Start MinIO
        run: |
          # A transient Docker Hub pull failure (rate limit, registry hiccup)
          # shouldn't fail the whole run by itself - retry a few times with a
          # short backoff before giving up. Applies to both images pulled in
          # this step (minio/mc used to have no retry at all here - a single
          # hiccup on just that pull failed the whole step with no mitigation,
          # even though the minio/minio pull right above it was protected).
          pull_with_retry() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              echo "$1 pull failed (attempt $attempt/3), retrying in 10s..."
              sleep 10
            done
            echo "$1 pull failed after 3 attempts - giving up."
            return 1
          }
          pull_with_retry minio/minio:latest
          pull_with_retry minio/mc:latest
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=oudhealth \
            -e MINIO_ROOT_PASSWORD=oudhealth-dev-secret \
            minio/minio:latest server /data
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "MinIO never became healthy within 60s - container state and logs:"
            docker ps -a --filter name=minio
            docker logs minio || true
            exit 1
          fi
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 oudhealth oudhealth-dev-secret &&
            mc mb --ignore-existing local/oudhealth-dev"

      - name: Prisma generate
        run: pnpm --filter @oudhealth/api exec prisma generate

      - name: Typecheck (api + web)
        run: |
          pnpm --filter @oudhealth/api exec tsc --noEmit
          pnpm --filter @oudhealth/web exec tsc --noEmit

      - name: Build web
        run: pnpm --filter @oudhealth/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          NEXT_PUBLIC_APP_PROTOCOL: http
          NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:9000

      - name: Migrate + role + RLS
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm run db:setup-role
          pnpm run prisma:rls

      - name: API test suite
        working-directory: apps/api
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke suite
        run: pnpm exec playwright test
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          NEXT_PUBLIC_APP_PROTOCOL: http
          NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:9000
          APP_ROOT_DOMAIN: localhost
          APP_PROTOCOL: http
          PORT: "3000"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
