name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oudhealth
          POSTGRES_PASSWORD: oudhealth
          POSTGRES_DB: oudhealth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oudhealth"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      # Owner connection: migrations, seed, prisma:rls, db:setup-role.
      DATABASE_URL: postgresql://oudhealth:oudhealth@localhost:5432/oudhealth?schema=public
      # App role: the API process connects here so RLS is exercised by the tests.
      APP_DATABASE_URL: postgresql://oudhealth_app:oudhealth-app-ci@localhost:5432/oudhealth?schema=public
      APP_DB_PASSWORD: oudhealth-app-ci
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789
      # NextAuth (Auth.js v5) refuses to sign/verify sessions without this -
      # apps/web/.env.local has it for local dev, but CI has no such file,
      # and it was missing from this workflow entirely: login in the e2e
      # suite was silently redirecting to /api/auth/error instead of
      # /dashboard, timing out global-setup.ts.
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: oudhealth-dev
      S3_ACCESS_KEY: oudhealth
      S3_SECRET_KEY: oudhealth-dev-secret
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Forbidden-dash scan
        run: node scripts/check-dashes.mjs

      - name: Start MinIO
        run: |
          # minio/minio and minio/mc were pulled from Docker Hub entirely
          # (and from every other free registry/binary channel - confirmed
          # 2026-10-12) as part of MinIO's 2025 licensing changes - there is
          # no free way to run the real community MinIO server anymore.
          # adobe/s3mock is a drop-in replacement: same S3 REST API, same
          # AWS-SDK presigned-URL flow apps/api's StorageService actually
          # uses (confirmed by hand against this exact service, including
          # the full storage integration suite). Still retry-protected -
          # this step's whole point is not letting a transient pull hiccup
          # fail the run - even though neither image is gated.
          pull_with_retry() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              echo "$1 pull failed (attempt $attempt/3), retrying in 10s..."
              sleep 10
            done
            echo "$1 pull failed after 3 attempts - giving up."
            return 1
          }
          pull_with_retry adobe/s3mock:latest
          docker run -d --name minio -p 9000:9090 \
            -e initialBuckets=oudhealth-dev \
            adobe/s3mock:latest
          ready=false
          for i in $(seq 1 30); do
            if wget -q -O /dev/null http://localhost:9000/; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "MinIO (s3mock) never became healthy within 60s - container state and logs:"
            docker ps -a --filter name=minio
            docker logs minio || true
            exit 1
          fi
          # initialBuckets alone was not reliable in testing - explicitly
          # create the bucket too. Bucket creation on S3 is just an empty
          # PUT to /{bucket}; s3mock accepts it unsigned, no client needed.
          curl -sf -X PUT http://localhost:9000/oudhealth-dev

      - name: Prisma generate
        run: pnpm --filter @oudhealth/api exec prisma generate

      - name: Typecheck (api + web)
        run: |
          pnpm --filter @oudhealth/api exec tsc --noEmit
          pnpm --filter @oudhealth/web exec tsc --noEmit

      - name: Build web
        run: pnpm --filter @oudhealth/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          NEXT_PUBLIC_APP_PROTOCOL: http
          NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:9000

      - name: Migrate + role + RLS
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm run db:setup-role
          pnpm run prisma:rls

      - name: API test suite
        working-directory: apps/api
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke suite
        run: pnpm exec playwright test
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          NEXT_PUBLIC_APP_PROTOCOL: http
          NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:9000
          # The API builds absolute tenant-subdomain redirect URLs server-
          # side (e.g. the new-hospital sign-up flow's ticket handoff) from
          # this alone - unlike the web app's own tenantUrl(), which reads
          # window.location.port at runtime, the API has no browser to read
          # a port from, so it must be baked in here. Missing the port sent
          # every such redirect to plain :80, where nothing listens - the
          # browser navigation never connected, so T1-02/T1-03's wait for
          # /dashboard after sign-up timed out even at 90s (not slow -
          # genuinely never arriving). apps/api/.env has the same value
          # locally, which is why this never showed up outside CI.
          APP_ROOT_DOMAIN: localhost:3001
          APP_PROTOCOL: http
          PORT: "3000"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
